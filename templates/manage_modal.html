<!-- Main modal (Overlay Backdrop) -->
<div id="modal-div" tabindex="-1" aria-hidden="true" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4 overflow-y-auto">
    
    <!-- Modal content (Box Utama Modal) -->
    <div class="relative w-full max-w-lg bg-[#2a2a2a] text-neutral-400 border border-[#343434] rounded-xl shadow-2xl p-4 md:p-6">
        
        <!-- Modal header -->
        <div class="flex items-center justify-center border-b border-[#343434] pb-4 md:pb-5">
            
            <h3 class="text-lg w-full text-center font-semibold text-[#dfdfdf]">
                Add new model
            </h3>
            <button onclick="document.getElementById('modal-div')?._flowbiteModal?.hide()" type="button" class="cursor-pointer text-[#b9b9b9] rounded-lg transition-colors border border-[#343434] bg-transparent hover:bg-neutral-800 hover:text-white rounded-lg text-sm w-9 h-9 ms-auto inline-flex justify-center items-center">
                <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 17.94 6M18 18 6.06 6"/>
                </svg>
                <span class="sr-only">Close modal</span>
            </button>
        </div>

        <!-- Modal body -->
        
            <div class="grid gap-4 grid-cols-2 py-4 md:py-6">
                <div class="col-span-2">
                    <label for="name" class="block mb-2 text-sm font-semibold text-[#dfdfdf]">ID</label>
                    <input type="number" name="modelId" id="modelId" class="appearance-none [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none bg-[#242424] border border-[#343434] text-white text-sm rounded-lg focus:border-[#28a99e] transition-colors outline-none block w-full px-3 py-2.5 placeholder:text-gray-500" placeholder="Type the id of the model" required="">
                </div>
                
            </div>

            <!-- Modal footer -->
            <div class="flex items-center space-x-4 border-t border-[#343434] pt-4 md:pt-6">
                <button hx-get="/add-models-ui" hx-include="#modelId" hx-target="#jakiro" class="cursor-pointer transition-all hover:opacity-90 inline-flex items-center bg-gradient-to-br from-teal-700 to-lime-200 font-medium rounded-xl text-sm text-white px-4 py-2.5 focus:outline-none">
                    <svg class="w-4 h-4 me-1.5 -ms-0.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14m-7 7V5"/></svg>
                    Add
                </button>
                <button type="button" onclick="document.getElementById('modal-div')?._flowbiteModal?.hide()" class="cursor-pointer text-gray-300 bg-[#242424] border border-[#343434] hover:bg-neutral-800 hover:text-white font-medium rounded-lg text-sm px-4 py-2.5 focus:outline-none">Cancel</button>
            </div>
        

        

    </div>
</div>
