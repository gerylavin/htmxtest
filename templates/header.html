<header class="sticky top-0 z-50 w-full bg-[#181818] flex justify-between md:justify-center items-center gap-2 px-6 md:px-8 py-4 border-b border-[#343434]">
        
        <!-- <div class="absolute left-4"> -->
        <!-- LOGO (Ganti berdasarkan breakpoint) -->
        <a href="#" class="flex items-center shrink-0 md:absolute md:left-4">
            <!-- Logo Icon (Layar Kecil / < md) -->
            <img 
                src="https://image.tensorartassets.com/cdn-cgi/image/anim=false,plain=false,f=webp,q=85/frontend/1720436708.svg" 
                class="h-8 w-auto block md:hidden" 
                alt="TensorArt Mini Logo" 
            />
            <!-- Logo Panjang Lengkap (Layar Desktop / >= md) -->
            <img 
                src="{{ url_for('static', path='images/tams_big.png') }}" 
                class="h-20 w-auto hidden md:block" 
                alt="TensorArt Full Logo" 
            />
        </a>
        <!-- </div> -->

        <!-- SEARCH AREA -->
        <div class="flex items-center md:flex-1 md:max-w-md md:mx-4 justify-end md:justify-start whitespace-nowrap">
            


            <!-- 2. Input Search Bar Panjang (Muncul di Desktop / >= md) -->
            <form class="w-full">
                <div class="relative flex items-center">
                    <input 
                        type="text" 
                        placeholder="Search" 
                        class="w-full h-10 bg-[#181818] border border-[#343434] text-white placeholder-gray-400 rounded-xl px-4 pe-10 text-sm outline-none focus:border-[#28a99e] transition-colors"
                    />
                    <div class="absolute right-3 flex items-center text-gray-400">
                        <iconpark-icon class="cursor-pointer text-xl flex items-center" icon-id="search" name="" size="1em">
                            <template shadowrootmode="open">
                                <svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="none" viewBox="0 0 24 24">
                                    <g><path data-follow-fill="currentColor" d="M10.5 1a9.5 9.5 0 1 0 5.973 16.887l4.38 4.38 1.415-1.413-4.38-4.38A9.46 9.46 0 0 0 20 10.5 9.5 9.5 0 0 0 10.5 1ZM3 10.5a7.5 7.5 0 1 1 15 0 7.5 7.5 0 0 1-15 0Z" fill="currentColor" fill-opacity=".85"></path></g>
                                </svg>
                            </template>
                        </iconpark-icon>
                    </div>
                </div>
            </form>
        </div>
        
        <!-- Button Create -->
        <div class="flex items-center">
            <button hx-get="/modal" hx-target="#modal-container" hx-trigger="click" type="button" class="h-10 px-4 md:px-10 gap-1.5 text-white bg-gradient-to-br from-teal-700 to-lime-200 font-medium rounded-xl text-sm inline-flex items-center justify-center cursor-pointer transition-all hover:opacity-90 shrink-0">
                <iconpark-icon class="text-lg flex items-center" icon-id="magic" name="" size="1em">
                    <template shadowrootmode="open">
                        <svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="none" viewBox="0 0 24 24">
                            <g><path fill="currentColor" d="M16 2a1 1 0 1 0-2 0v2.5a1 1 0 1 0 2 0V2ZM16 13.5a1 1 0 1 0-2 0V16a1 1 0 0 0 2 0v-2.5ZM8 8a1 1 0 0 0 0 2h2.5a1 1 0 0 0 0-2H8ZM19.5 8a1 1 0 1 0 0 2H22a1 1 0 0 0 0-2h-2.5ZM20.657 3.343a1 1 0 0 1 0 1.414l-1.768 1.768a1 1 0 1 1-1.414-1.414l1.768-1.768a1 1 0 0 1 1.414 0ZM15.5 9.914 3.48 21.935a1 1 0 0 1-1.415-1.414L14.085 8.5A1 1 0 1 1 15.5 9.914ZM10.757 3.343a1 1 0 1 0-1.414 1.414l1.768 1.768a1 1 0 0 0 1.414-1.414l-1.768-1.768ZM18.89 11.475a1 1 0 0 0-1.415 1.414l1.768 1.768a1 1 0 0 0 1.414-1.414l-1.768-1.768Z" data-follow-fill="currentColor"></path></g>
                        </svg>
                    </template>
                </iconpark-icon>
                <span>Create</span>
            </button>
        </div>

        
        
    </header>
